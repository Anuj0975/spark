<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body bgcolor="skyblue">
    <h1 style="font-size: x-large; text-align: center;">AIT OSS Club Registration Form</h1>
    <hr>
    <form>
    <label for="name">Full Name:</label>
    <br>
   <input type="text" id="name" placeholder="Enter Your Name" style="background-color: pink;"/>
   <br>
   <label for="email">Email:</label>
   <br>
   <input type="email" id="email" placeholder="Enter Your Email" style="background-color: rgb(158, 173, 98);"/>
   <br>
   <input type="submit" value="Register"/>
   <br>
   <label for="password">Password:</label>
   <br>
   <input type="password" id="password" placeholder="Enter Your Password" style="background-color: rgb(56, 23, 190);"/>
    <br>
    <br>
    <label for="gender">Gender:</label>
    <br>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
    <br>
    <label for="language">Language Known:</label>
    <br>
<input type="checkbox" id="HTML" name="language" value="html">
    <label for="HTML">HTML</label>
    <input type="checkbox" id="css" name="language" value="css">
    <label for="CSS">CSS</label>
    <input type="checkbox" id="javascript" name="language" value="javascript">
    <label for="JavaScript">JavaScript</label>
    <br>
    <br>
    <label for="why">Why do you want to join OSS Club?</label>
    <br>
    <textarea id="why" name="why" rows="4" cols="50"></textarea>
    <br>
    <br>
    <input type="submit" value="Submit"/>
    <input type="reset" value="Reset"/>
    <br>
    <hr>
    <br>

    <br>
